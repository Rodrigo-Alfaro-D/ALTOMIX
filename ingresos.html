<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTOMIX — Ingresos (Ventas)</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/auth.js"></script>
<script>Auth.protegerPagina();</script>

<div class="app-container">
    <div class="user-bar">
        👤 Conectado como: <strong id="usuarioActual">—</strong>
        <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
    </div>

    <div class="nav-bar">
        <a href="index.html">🏠 Inicio</a>
        <a href="ingresos.html" class="ventas-link active">📈 Ingresos (Ventas)</a>
        <a href="gastos.html">📉 Gastos (Compras)</a>
        <a href="informe.html">📊 Informe</a>
    </div>

    <div class="card ventas" style="max-width:640px; margin: 0 auto;">
        <div class="brand-logo">ALTOMIX</div>
        <h2>📈 Registrar Venta (Ingreso)</h2>
        <form id="formVenta" novalidate>
            <div class="form-group">
                <label>💵 Forma de pago (venta)</label>
                <select id="formaPagoVenta" required>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Debito">Débito</option>
                    <option value="Credito">Crédito</option>
                </select>
            </div>
            <div class="form-group">
                <label>📝 Concepto / Producto vendido</label>
                <input type="text" id="conceptoVenta" placeholder="Ej: Venta de silla, servicio..." required>
            </div>
            <div class="form-group">
                <label>💲 Monto de la venta</label>
                <input type="number" id="montoVenta" step="0.01" placeholder="Monto recibido" required>
            </div>
            <button type="submit" class="btn-venta">+ Agregar Venta</button>
        </form>
    </div>

    <footer>© ALTOMIX — Los ingresos se reflejan automáticamente en el <a href="informe.html">informe</a>.</footer>
</div>

<script src="js/storage.js"></script>
<script src="js/ingresos.js"></script>
</body>
</html>
